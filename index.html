<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estudio Rojo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--paper:#ECEEF1;--sheet:#FBFBFC;--ink:#15171B;--muted:#5B626C;--line:#D3D8DE;--pencil:#D3242C}
@media (prefers-color-scheme:dark){:root{--paper:#111214;--sheet:#1A1C1F;--ink:#ECEDEF;--muted:#9BA1A9;--line:#2D3035;--pencil:#FF4F55;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif;padding-inline:16px;padding-block:48px}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.eyebrow{font:500 12px/1 "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--pencil)}
h1{font:800 clamp(40px,9vw,64px)/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:8px 0 0}
p{color:var(--muted);margin:0}
ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
a.tool{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--sheet);border:1.5px solid var(--line);border-radius:10px;padding:18px 20px;color:inherit;text-decoration:none}
a.tool:hover{border-color:var(--pencil)}
a.tool b{display:block;font-size:18px}
a.tool span.go{font:500 18px "JetBrains Mono",monospace;color:var(--pencil)}
</style>
</head>
<body>
<main>
  <div><span class="eyebrow">Herramientas para clientes</span><h1>Estudio Rojo</h1></div>
  <ul>
    <li><a class="tool" href="edicion/"><span><b>Pedido de retoque</b><p>Indica qué cambiar en cada foto y adjunta referencias.</p></span><span class="go">→</span></a></li>
  </ul>
</main>
</body>
</html>
